<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Koality-Assured Homebrew Tap Banner">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bannerBg" cx="20%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Amber Glow on Left Side -->
    <radialGradient id="ambientAmberLeft" cx="19%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Blue / Slate Ambient on Right Side -->
    <radialGradient id="ambientRight" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Amber Gradient -->
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="20%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Brass Metallic Gradient -->
    <linearGradient id="brassMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Dark Brass Gradient -->
    <linearGradient id="darkBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Froth Gradient -->
    <linearGradient id="foamHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FEF3C7" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glowAmberBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect x="8" y="8" width="1184" height="404" rx="28" fill="url(#bannerBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Overlays -->
  <circle cx="230" cy="210" r="260" fill="url(#ambientAmberLeft)" />
  <circle cx="980" cy="140" r="280" fill="url(#ambientRight)" />

  <!-- Background Tech Grid Lines & Circuit Elements -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1">
    <line x1="480" y1="20" x2="480" y2="400" stroke-dasharray="6 6" />
    <line x1="820" y1="20" x2="820" y2="400" stroke-dasharray="6 6" />
    <line x1="1140" y1="20" x2="1140" y2="400" stroke-dasharray="6 6" />
    <line x1="420" y1="140" x2="1160" y2="140" stroke-dasharray="6 6" />
    <line x1="420" y1="280" x2="1160" y2="280" stroke-dasharray="6 6" />
  </g>

  <!-- Tech Accent Corners -->
  <path d="M 28 48 L 48 28 L 88 28" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="88" cy="28" r="3.5" fill="#F59E0B" />

  <path d="M 1172 48 L 1152 28 L 1112 28" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="1112" cy="28" r="3.5" fill="#38BDF8" />

  <path d="M 28 372 L 48 392 L 88 392" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="88" cy="392" r="3.5" fill="#38BDF8" />

  <path d="M 1172 372 L 1152 392 L 1112 392" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="1112" cy="392" r="3.5" fill="#F59E0B" />

  <!-- ==================== LEFT HERO EMBLEM: HOMEBREW TAP & STEIN ==================== -->
  <g transform="translate(40, 20)">
    <!-- Tech Frame Ring Around Emblem -->
    <circle cx="190" cy="190" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
    <circle cx="190" cy="190" r="148" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Circuit Nodes around Emblem -->
    <path d="M 50 190 L 75 190 L 95 170" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" />
    <circle cx="50" cy="190" r="3.5" fill="#F59E0B" fill-opacity="0.5" />

    <!-- Spigot Mechanism -->
    <g filter="url(#bannerShadow)">
      <!-- Supply Pipe -->
      <path d="M 75 60 L 130 60 C 138 60 146 68 146 76 L 146 112 C 146 120 154 128 162 128 L 180 128" 
            fill="none" stroke="url(#brassMetal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 75 60 L 130 60 C 138 60 146 68 146 76 L 146 112 C 146 120 154 128 162 128 L 180 128" 
            fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

      <!-- Flange -->
      <rect x="68" y="50" width="12" height="20" rx="3" fill="url(#darkBrass)" stroke="#F59E0B" stroke-width="1" />

      <!-- Valve Block -->
      <rect x="172" y="114" width="32" height="28" rx="5" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1" />
      <line x1="188" y1="114" x2="188" y2="142" stroke="#78350F" stroke-width="2" />

      <!-- Tap Handle -->
      <path d="M 188 114 L 188 68" stroke="url(#brassMetal)" stroke-width="8" stroke-linecap="round" />
      <rect x="182" y="62" width="12" height="10" rx="2" fill="url(#darkBrass)" />
      <path d="M 181 62 C 178 45 176 34 188 28 C 200 34 198 45 195 62 Z" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1" />
      <circle cx="188" cy="34" r="3.5" fill="#38BDF8" filter="url(#glowAmberBanner)" />

      <!-- Faucet Nozzle -->
      <path d="M 188 142 C 188 158 178 168 168 171 L 161 173" 
            fill="none" stroke="url(#brassMetal)" stroke-width="12" stroke-linecap="round" />
      <ellipse cx="160" cy="176" rx="6" ry="3.5" fill="#451A03" stroke="#FDE68A" stroke-width="1" />

      <!-- Golden Amber Pouring Stream -->
      <path d="M 160 179 C 160 196 164 206 166 220" 
            fill="none" stroke="url(#amberLiquid)" stroke-width="5" stroke-linecap="round" filter="url(#glowAmberBanner)" />
      <path d="M 160 179 C 160 196 164 206 166 220" 
            fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Beer Stein -->
    <g filter="url(#bannerShadow)">
      <!-- Handle -->
      <path d="M 252 230 C 304 230 318 254 318 284 C 318 318 302 342 252 344" 
            fill="none" stroke="#1E293B" stroke-width="26" stroke-linecap="round" />
      <path d="M 252 230 C 304 230 318 254 318 284 C 318 318 302 342 252 344" 
            fill="none" stroke="url(#brassMetal)" stroke-width="18" stroke-linecap="round" />
      <path d="M 252 230 C 304 230 318 254 318 284 C 318 318 302 342 252 344" 
            fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" opacity="0.65" />

      <!-- Stein Vessel Body -->
      <rect x="110" y="210" width="144" height="152" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2.5" />
      <rect x="115" y="222" width="134" height="135" rx="22" fill="url(#amberLiquid)" />

      <!-- Bubbles -->
      <circle cx="135" cy="320" r="3" fill="#FEF3C7" opacity="0.6" />
      <circle cx="152" cy="285" r="2.5" fill="#FEF3C7" opacity="0.75" />
      <circle cx="170" cy="330" r="3.5" fill="#FEF3C7" opacity="0.5" />
      <circle cx="195" cy="300" r="2.5" fill="#FEF3C7" opacity="0.8" />
      <circle cx="218" cy="325" r="3" fill="#FEF3C7" opacity="0.6" />

      <!-- Glass Ribs / Highlights -->
      <rect x="132" y="226" width="18" height="124" rx="8" fill="#FFFFFF" fill-opacity="0.14" />
      <rect x="173" y="226" width="18" height="124" rx="8" fill="#FFFFFF" fill-opacity="0.10" />
      <rect x="214" y="226" width="18" height="124" rx="8" fill="#000000" fill-opacity="0.22" />

      <!-- Center Logo Crest: Terminal Prompt >_ -->
      <g transform="translate(182, 292)">
        <polygon points="-24,-16 24,-16 32,0 24,16 -24,16 -32,0" fill="#0F172A" stroke="url(#brassMetal)" stroke-width="1.5" />
        <path d="M -13 -6 L -5 0 L -13 6" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="-1" y1="6" x2="13" y2="6" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Stein Base Foot -->
      <rect x="104" y="358" width="156" height="14" rx="7" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1" />

      <!-- Foamy Head -->
      <g filter="url(#glowAmberBanner)">
        <path d="M 104 216 
                 C 98 206 102 192 118 190 
                 C 123 176 139 174 153 182 
                 C 161 170 181 167 194 179 
                 C 205 169 226 172 233 186 
                 C 248 184 259 196 256 209 
                 C 265 216 264 229 252 234
                 C 242 236 234 229 231 221
                 C 221 231 203 229 195 219
                 C 183 231 165 229 159 217
                 C 147 227 129 225 121 215
                 C 113 220 106 218 104 216 Z" 
              fill="url(#foamHead)" />
        <circle cx="160" cy="195" r="2.5" fill="#FFFFFF" />
        <circle cx="205" cy="192" r="3" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CONTENT: TYPOGRAPHY & SPECS ==================== -->
  <!-- Top Eyebrow Badge Pill -->
  <g transform="translate(450, 68)">
    <rect x="0" y="0" width="345" height="30" rx="15" fill="#1E293B" stroke="url(#brassMetal)" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4.5" fill="#F59E0B" filter="url(#glowAmberBanner)" />
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" font-weight="700" fill="#FEF3C7" letter-spacing="1.5">OFFICIAL HOMEBREW DISTRIBUTION TAP</text>
  </g>

  <!-- Main Hero Title -->
  <text x="450" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
    Koality-Assured / tap
  </text>

  <!-- Tagline / Subtitle -->
  <text x="450" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="19" font-weight="500" fill="#CBD5E1">
    Official macOS &amp; Linux package distribution repository for developer tooling &amp; domain harnesses.
  </text>

  <!-- Interactive Terminal Quick-Start Code Block -->
  <g transform="translate(450, 218)" filter="url(#bannerShadow)">
    <!-- Terminal Background Box -->
    <rect x="0" y="0" width="690" height="74" rx="12" fill="#0B132B" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Controls Dots -->
    <circle cx="22" cy="22" r="5" fill="#EF4444" opacity="0.85" />
    <circle cx="38" cy="22" r="5" fill="#F59E0B" opacity="0.85" />
    <circle cx="54" cy="22" r="5" fill="#10B981" opacity="0.85" />

    <!-- Terminal Command Line 1 -->
    <text x="22" y="52" font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, 'Courier New', monospace" 
          font-size="15" font-weight="600" fill="#38BDF8">$</text>
    <text x="40" y="52" font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, 'Courier New', monospace" 
          font-size="15" font-weight="600" fill="#FDE68A">brew tap Koality-Assured/tap</text>
    <text x="325" y="52" font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, 'Courier New', monospace" 
          font-size="15" font-weight="600" fill="#94A3B8">&amp;&amp;</text>
    <text x="355" y="52" font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, 'Courier New', monospace" 
          font-size="15" font-weight="600" fill="#FEF3C7">brew install harness</text>
  </g>

  <!-- Bottom Badges / Feature Highlights -->
  <g transform="translate(450, 322)">
    <!-- Feature Pill 1: macOS Support -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="34" rx="8" fill="#111C35" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38BDF8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#E2E8F0">macOS (Apple Silicon &amp; Intel)</text>
    </g>

    <!-- Feature Pill 2: Linux Support -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="185" height="34" rx="8" fill="#111C35" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#F59E0B" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#E2E8F0">Linux (arm64 &amp; amd64)</text>
    </g>

    <!-- Feature Pill 3: Verified Checksums -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#111C35" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#10B981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#E2E8F0">Verified SHA256</text>
    </g>

    <!-- Feature Pill 4: Zero-Lag Releases -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="85" height="34" rx="8" fill="#111C35" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#F59E0B" />
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#E2E8F0">MIT</text>
    </g>
  </g>
</svg>
