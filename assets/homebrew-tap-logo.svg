<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Koality-Assured Homebrew Tap Logo">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Amber Core Ambient Glow -->
    <radialGradient id="amberAmbient" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Amber Gradient -->
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="18%" stop-color="#FBBF24" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Brass Metallic Gradient -->
    <linearGradient id="brassMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Dark Brass / Aged Metal Gradient -->
    <linearGradient id="darkBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Stein Foam Head Gradient -->
    <linearGradient id="foamHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Rim & Cyber Accents Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Cyan Circuit Highlight -->
    <linearGradient id="cyanTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowAmber" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />
  <circle cx="256" cy="265" r="215" fill="url(#amberAmbient)" />

  <!-- Outer Tech Compass Ring & Dial Ticks -->
  <circle cx="256" cy="265" r="198" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="256" cy="265" r="182" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" />

  <!-- Circuit Trace Accents -->
  <path d="M 85 120 L 135 120 L 165 150" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="85" cy="120" r="4" fill="#F59E0B" fill-opacity="0.4" />

  <path d="M 427 120 L 377 120 L 347 150" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="427" cy="120" r="4" fill="#38BDF8" fill-opacity="0.5" />

  <path d="M 95 385 L 130 385 L 150 405" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="95" cy="385" r="4" fill="#38BDF8" fill-opacity="0.5" />

  <path d="M 417 385 L 382 385 L 362 405" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="417" cy="385" r="4" fill="#F59E0B" fill-opacity="0.4" />

  <!-- ==================== HOMEBREW TAP SPIGOT MECHANISM ==================== -->
  <g filter="url(#softShadow)">
    <!-- Tap Supply Pipe (Top left coming in) -->
    <path d="M 120 70 L 185 70 C 195 70 205 78 205 88 L 205 130 C 205 140 215 148 225 148 L 245 148" 
          fill="none" stroke="url(#brassMetal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 120 70 L 185 70 C 195 70 205 78 205 88 L 205 130 C 205 140 215 148 225 148 L 245 148" 
          fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

    <!-- Tap Mounting Collar / Flange -->
    <rect x="110" y="58" width="14" height="24" rx="4" fill="url(#darkBrass)" stroke="#F59E0B" stroke-width="1" />

    <!-- Tap Valve Body Block -->
    <rect x="236" y="132" width="38" height="34" rx="6" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1.5" />
    <!-- Valve Body Nut Ring -->
    <line x1="255" y1="132" x2="255" y2="166" stroke="#78350F" stroke-width="2" />

    <!-- Tap Handle / Lever (Going Upright) -->
    <path d="M 255 132 L 255 78" stroke="url(#brassMetal)" stroke-width="9" stroke-linecap="round" />
    <!-- Handle Ferrule -->
    <rect x="248" y="70" width="14" height="12" rx="3" fill="url(#darkBrass)" />
    <!-- Classic Tap Knob (Turned Wood / Polished Brass) -->
    <path d="M 247 70 C 243 50 241 38 255 30 C 269 38 267 50 263 70 Z" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="255" cy="38" r="4" fill="#38BDF8" filter="url(#glowAmber)" />

    <!-- Tap Spout / Faucet Nozzle (Downward Curvature) -->
    <path d="M 255 166 C 255 186 242 196 230 200 L 222 203" 
          fill="none" stroke="url(#brassMetal)" stroke-width="14" stroke-linecap="round" />
    <path d="M 222 198 L 216 208 L 228 206 Z" fill="url(#brassMetal)" />
    <!-- Spout Opening Rim -->
    <ellipse cx="221" cy="206" rx="7" ry="4" fill="#451A03" stroke="#FDE68A" stroke-width="1" />

    <!-- Golden Amber Pouring Stream -->
    <path d="M 221 209 C 221 228 226 240 228 258" 
          fill="none" stroke="url(#amberLiquid)" stroke-width="6" stroke-linecap="round" filter="url(#glowAmber)" />
    <path d="M 221 209 C 221 228 226 240 228 258" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- ==================== BEER STEIN / MUG ==================== -->
  <g filter="url(#softShadow)">
    <!-- Stein Heavy Handle (Right Side) -->
    <path d="M 326 270 C 392 270 410 300 410 338 C 410 380 390 410 326 412" 
          fill="none" stroke="#1E293B" stroke-width="32" stroke-linecap="round" />
    <path d="M 326 270 C 392 270 410 300 410 338 C 410 380 390 410 326 412" 
          fill="none" stroke="url(#brassMetal)" stroke-width="24" stroke-linecap="round" />
    <path d="M 326 270 C 392 270 410 300 410 338 C 410 380 390 410 326 412" 
          fill="none" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" opacity="0.65" />

    <!-- Stein Body Outer Hull / Base -->
    <rect x="156" y="246" width="176" height="186" rx="34" fill="#0F172A" stroke="#334155" stroke-width="3" />

    <!-- Amber Beer Chamber Fill -->
    <rect x="162" y="260" width="164" height="166" rx="28" fill="url(#amberLiquid)" />

    <!-- Beer Carbonation Bubbles -->
    <circle cx="185" cy="380" r="3.5" fill="#FEF3C7" opacity="0.6" />
    <circle cx="196" cy="330" r="2.5" fill="#FEF3C7" opacity="0.7" />
    <circle cx="210" cy="395" r="4" fill="#FEF3C7" opacity="0.5" />
    <circle cx="228" cy="350" r="3" fill="#FEF3C7" opacity="0.8" />
    <circle cx="245" cy="390" r="2" fill="#FEF3C7" opacity="0.6" />
    <circle cx="270" cy="365" r="3.5" fill="#FEF3C7" opacity="0.75" />
    <circle cx="295" cy="385" r="2.5" fill="#FEF3C7" opacity="0.6" />
    <circle cx="305" cy="340" r="3" fill="#FEF3C7" opacity="0.8" />

    <!-- Glass Facet Vertical Pillars / Ribs (Classic Heavy Dimple/Facet Stein Effect) -->
    <rect x="184" y="264" width="22" height="152" rx="10" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="233" y="264" width="22" height="152" rx="10" fill="#FFFFFF" fill-opacity="0.10" />
    <rect x="282" y="264" width="22" height="152" rx="10" fill="#000000" fill-opacity="0.22" />

    <!-- Front Tech Emblem on Stein: Command Prompt & Package Cube -->
    <g transform="translate(244, 345)">
      <!-- Octagonal Badge / Tech Crest -->
      <polygon points="-32,-22 32,-22 44,0 32,22 -32,22 -44,0" fill="#0F172A" stroke="url(#brassMetal)" stroke-width="2" />
      <!-- Terminal Prompt Symbol `>_` -->
      <path d="M -18 -8 L -8 0 L -18 8" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-3" y1="8" x2="16" y2="8" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Stein Heavy Base Foot -->
    <rect x="148" y="426" width="192" height="16" rx="8" fill="url(#brassMetal)" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="168" y="438" width="152" height="4" rx="2" fill="#78350F" opacity="0.8" />

    <!-- ==================== FOAM FROTH HEAD ==================== -->
    <!-- Pillowy Clouds of Creamy Brew Foam -->
    <g filter="url(#glowAmber)">
      <path d="M 150 252 
               C 142 240 148 222 166 220 
               C 172 204 192 200 208 210 
               C 218 195 242 192 258 206 
               C 272 194 298 198 306 214 
               C 324 212 338 226 334 242 
               C 346 250 344 266 330 272
               C 318 274 308 266 304 256
               C 292 268 270 266 260 254
               C 246 268 224 266 216 252
               C 202 264 180 262 170 250
               C 160 256 152 254 150 252 Z" 
            fill="url(#foamHead)" />
      <!-- Foam Froth Highlight Edge -->
      <path d="M 166 220 C 172 204 192 200 208 210 C 218 195 242 192 258 206 C 272 194 298 198 306 214 C 324 212 338 226 334 242" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Overflowing Foam Drip on Left Side -->
      <path d="M 158 250 C 158 266 166 276 166 288 C 166 294 162 298 158 298 C 154 298 150 294 150 288 C 150 272 154 260 156 250 Z" 
            fill="url(#foamHead)" />

      <!-- Subtle Froth Bubble Dots -->
      <circle cx="218" cy="226" r="3" fill="#FFFFFF" />
      <circle cx="274" cy="222" r="3.5" fill="#FFFFFF" />
      <circle cx="240" cy="216" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Brand Text Monogram Pill -->
  <g transform="translate(256, 474)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#1E293B" stroke="url(#brassMetal)" stroke-width="1.5" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" font-weight="800" fill="#FDE68A" letter-spacing="2" text-anchor="middle">KOALITY-ASSURED</text>
  </g>
</svg>
